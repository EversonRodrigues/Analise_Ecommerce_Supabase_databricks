# The main pipeline for projeto_ecommerce

resources:
  pipelines:
    projeto_ecommerce_etl:
      name: projeto_ecommerce_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/projeto_ecommerce_etl"

      libraries:
        - glob:
            include: ../src/projeto_ecommerce_etl/transformations/**

      # O template trazia aqui um `environment.dependencies: [--editable ${workspace.file_path}]`,
      # que aponta para um pyproject.toml. Este projeto nao tem pacote Python proprio: as
      # transformacoes so usam pyspark, ja disponivel no serverless. Manter a dependencia
      # editable quebraria a instalacao do ambiente.
