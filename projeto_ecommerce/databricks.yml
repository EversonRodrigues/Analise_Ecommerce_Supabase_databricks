# This is a Declarative Automation Bundle definition for projeto_ecommerce.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: projeto_ecommerce
  uuid: 280becd4-9bd6-4e5b-850b-bc4d53ef5cab

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  # POR QUE o warehouse vem de lookup pelo nome e nao do id literal:
  #   O id (47307f0445a667ac neste workspace) e opaco e muda se o warehouse for recriado.
  #   Com lookup, o bundle resolve pelo nome no validate e falha ALTO se o warehouse for
  #   renomeado ou apagado, em vez de deployar um dashboard que nao consulta nada.
  # ATENCAO ao efeito colateral: com este lookup declarado, o warehouse passa a ser
  #   dependencia de qualquer `bundle validate` -- inclusive dos deploys da pipeline, que
  #   por si nao precisam de warehouse. E a troca desejada (falha alta > dashboard mudo).
  warehouse_id:
    description: SQL warehouse que executa as consultas dos dashboards
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-73ba6d88-0c16.cloud.databricks.com
    variables:
      catalog: projetoecomerce
      # Schema padrao do pipeline: a silver. As golds sao publicadas com nome
      # qualificado (gold.<tabela>) direto no codigo.
      schema: silver
  prod:
    mode: production
    workspace:
      host: https://dbc-73ba6d88-0c16.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/everson101288@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/everson101288@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: projetoecomerce
      schema: prod
    permissions:
      - user_name: everson101288@gmail.com
        level: CAN_MANAGE
