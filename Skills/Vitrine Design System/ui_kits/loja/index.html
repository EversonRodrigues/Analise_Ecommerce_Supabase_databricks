<!-- @dsCard group="Loja Vitrine" viewport="1440x900" name="Loja — protótipo" subtitle="Home → Produto → Carrinho, clicável" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Vitrine — Loja</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script></head>
<body><div id="root"></div>
<script type="text/babel" src="Header.jsx"></script><script type="text/babel" src="Footer.jsx"></script><script type="text/babel" src="HomeScreen.jsx"></script><script type="text/babel" src="ProductScreen.jsx"></script><script type="text/babel" src="CartScreen.jsx"></script>
<script type="text/babel">
function App(){
  const saved = JSON.parse(localStorage.getItem('vitrine-route') || '{"r":"home","id":1}');
  const [route, setRoute] = React.useState(saved.r);
  const [pid, setPid] = React.useState(saved.id);
  const P = window.VITRINE_DATA.products;
  const [cart, setCart] = React.useState([{ p: P[2], qty: 1 }]);
  const go = (r, p) => { setRoute(r); if (p) setPid(p.id); window.scrollTo(0, 0); localStorage.setItem('vitrine-route', JSON.stringify({ r, id: p ? p.id : pid })); };
  const add = (p, q = 1) => setCart((c) => c.find((i) => i.p.id === p.id) ? c.map((i) => i.p.id === p.id ? { ...i, qty: i.qty + q } : i) : [...c, { p, qty: q }]);
  const setQty = (id, n) => setCart((c) => c.map((i) => i.p.id === id ? { ...i, qty: n } : i));
  const remove = (id) => setCart((c) => c.filter((i) => i.p.id !== id));
  const product = P.find((x) => x.id === pid) || P[0];
  return <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
    <Header cartCount={cart.reduce((s, i) => s + i.qty, 0)} go={go} />
    <div style={{flex:1}}>
    {route === 'home' && <HomeScreen go={go} add={add} />}
    {route === 'product' && <ProductScreen product={product} go={go} add={add} />}
    {route === 'cart' && <CartScreen cart={cart} setQty={setQty} remove={remove} go={go} />}
    </div>
    <Footer />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
