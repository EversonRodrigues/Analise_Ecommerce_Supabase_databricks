<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base; airy — sections 64px apart" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px/1.2 var(--font-sans)}.v{font:400 12px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--lime-500);border-radius:3px"></div><div class="n">1</div><div class="v" id="s1"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--lime-500);border-radius:3px"></div><div class="n">2</div><div class="v" id="s2"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--lime-500);border-radius:3px"></div><div class="n">3</div><div class="v" id="s3"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--lime-500);border-radius:3px"></div><div class="n">4</div><div class="v" id="s4"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--lime-500);border-radius:3px"></div><div class="n">5</div><div class="v" id="s5"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--lime-500);border-radius:3px"></div><div class="n">6</div><div class="v" id="s6"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--lime-500);border-radius:3px"></div><div class="n">8</div><div class="v" id="s8"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-10);height:var(--space-10);background:var(--lime-500);border-radius:3px"></div><div class="n">10</div><div class="v" id="s10"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--lime-500);border-radius:3px"></div><div class="n">12</div><div class="v" id="s12"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--lime-500);border-radius:3px"></div><div class="n">16</div><div class="v" id="s16"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-20);height:var(--space-20);background:var(--lime-500);border-radius:3px"></div><div class="n">20</div><div class="v" id="s20"></div></div></div><script>document.querySelectorAll('[id^=s]').forEach(e=>e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--space-'+e.id.slice(1)).trim())</script></body></html>
