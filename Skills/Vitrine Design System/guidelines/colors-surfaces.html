<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page, card, sunken, inverse, accent aliases" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px/1.2 var(--font-sans)}.v{font:400 12px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">surface-page</div><div class="v">paper-50</div></div><div class="sw"><div class="chip" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">surface-card</div><div class="v">white</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">surface-sunken</div><div class="v">paper-100</div></div><div class="sw"><div class="chip" style="background:var(--surface-muted);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">surface-muted</div><div class="v">ink-50</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);"></div><div class="n">surface-inverse</div><div class="v">ink-900</div></div><div class="sw"><div class="chip" style="background:var(--surface-accent);"></div><div class="n">surface-accent</div><div class="v">lime-500</div></div><div class="sw"><div class="chip" style="background:var(--surface-accent-soft);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="n">surface-accent-soft</div><div class="v">lime-100</div></div></div></body></html>
