<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px/1.2 var(--font-sans)}.v{font:400 12px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:96px;background:var(--surface-card);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-sans);box-shadow:inset 0 0 0 1px var(--border-subtle)">Primário</div><div class="v">text-primary</div></div><div class="sw"><div class="chip" style="height:96px;background:var(--surface-card);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-sans);box-shadow:inset 0 0 0 1px var(--border-subtle)">Secundário</div><div class="v">text-secondary</div></div><div class="sw"><div class="chip" style="height:96px;background:var(--surface-card);color:var(--text-deal);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-sans);box-shadow:inset 0 0 0 1px var(--border-subtle)">-32% oferta</div><div class="v">text-deal</div></div><div class="sw"><div class="chip" style="height:96px;background:var(--surface-inverse);color:var(--text-inverse);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-sans);box-shadow:inset 0 0 0 1px var(--border-subtle)">Inverso</div><div class="v">text-inverse</div></div><div class="sw"><div class="chip" style="height:96px;background:var(--surface-inverse);color:var(--lime-500);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-sans);box-shadow:inset 0 0 0 1px var(--border-subtle)">Destaque</div><div class="v">lime-500</div></div><div class="sw"><div class="chip" style="height:96px;background:var(--surface-accent);color:var(--text-on-accent);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-sans);box-shadow:inset 0 0 0 1px var(--border-subtle)">Sobre lime</div><div class="v">text-on-accent</div></div></div></body></html>
