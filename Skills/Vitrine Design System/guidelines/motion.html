<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Quick ease-out; lift on hover, shrink on press" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px/1.2 var(--font-sans)}.v{font:400 12px/1.2 var(--font-sans);color:var(--text-muted)}.hov{animation:h 2.4s infinite}.prs{animation:p 1.6s infinite}.foc{box-shadow:0 0 0 4px var(--lime-200),inset 0 0 0 1.5px var(--ink-900)!important}@keyframes h{0%,40%{transform:none}50%,90%{transform:translateY(-2px);box-shadow:var(--shadow-2)}}@keyframes p{0%,60%{transform:none}70%,80%{transform:scale(.98)}}</style></head><body><div class="row" style="gap:20px"><div class="sw"><div class="hov" style="height:64px;border-radius:var(--radius-lg);background:var(--white);box-shadow:var(--shadow-1);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-sans);transition:all var(--dur-base) var(--ease-out)">hover</div><div class="v">translateY(-2px) + shadow-2</div></div><div class="sw"><div class="prs" style="height:64px;border-radius:var(--radius-lg);background:var(--white);box-shadow:var(--shadow-1);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-sans);transition:all var(--dur-base) var(--ease-out)">press</div><div class="v">scale(.98)</div></div><div class="sw"><div class="foc" style="height:64px;border-radius:var(--radius-lg);background:var(--white);box-shadow:var(--shadow-1);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-sans);transition:all var(--dur-base) var(--ease-out)">focus</div><div class="v">ink ring / lime halo</div></div><div class="sw"><div class="n">--ease-out</div><div class="v">cubic-bezier(.2,.8,.2,1)</div><div class="n">durations</div><div class="v">120 · 200 · 360ms</div></div></div></body></html>
