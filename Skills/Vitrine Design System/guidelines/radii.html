<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px/1.2 var(--font-sans)}.v{font:400 12px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div style="height:72px;background:var(--surface-card);box-shadow:inset 0 0 0 1.5px var(--ink-900);border-radius:var(--radius-xs)"></div><div class="n">radius-xs</div><div class="v">6px · checkbox</div></div><div class="sw"><div style="height:72px;background:var(--surface-card);box-shadow:inset 0 0 0 1.5px var(--ink-900);border-radius:var(--radius-sm)"></div><div class="n">radius-sm</div><div class="v">10px · small chips</div></div><div class="sw"><div style="height:72px;background:var(--surface-card);box-shadow:inset 0 0 0 1.5px var(--ink-900);border-radius:var(--radius-md)"></div><div class="n">radius-md</div><div class="v">14px · inputs, images</div></div><div class="sw"><div style="height:72px;background:var(--surface-card);box-shadow:inset 0 0 0 1.5px var(--ink-900);border-radius:var(--radius-lg)"></div><div class="n">radius-lg</div><div class="v">20px · cards</div></div><div class="sw"><div style="height:72px;background:var(--surface-card);box-shadow:inset 0 0 0 1.5px var(--ink-900);border-radius:var(--radius-xl)"></div><div class="n">radius-xl</div><div class="v">28px · banners, tiles</div></div><div class="sw"><div style="height:72px;background:var(--surface-card);box-shadow:inset 0 0 0 1.5px var(--ink-900);border-radius:var(--radius-pill)"></div><div class="n">radius-pill</div><div class="v">999px · buttons, badges</div></div></div></body></html>
